server:
  port: ${PORT:8080}

spring:
  application:
    name: tacticaldev-backend

  # MySQL / MariaDB. La base "tacticaldev" se crea sola si no existe.
  # En la EC2 se pasan DB_USER y DB_PASS como variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tacticaldev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASS:}

  jpa:
    hibernate:
      ddl-auto: update        # crea/actualiza las tablas a partir de las entidades
    open-in-view: false
    show-sql: false

  jackson:
    time-zone: America/Santiago
